[project]
name = "hr-assistant"
version = "0.1.0"
description = "HR Assistant: chat RAG per trovare il candidato ideale tra i curriculum"
authors = [
    {name = "Giuseppe Giannelli", email = "peppegiannelli@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb (>=1.5.0,<2.0.0)",
    "openai (>=3.0.0,<4.0.0)",
    "chainlit (>=2.12.0,<3.0.0)",
    "ollama (>=0.6.0,<0.7.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "markitdown[pdf,docx,pptx,xlsx,xls] (>=0.1.8,<0.2.0)",
]

[tool.poetry]
package-mode = false

# Embedding locali con SentenceTransformer (scarica torch): poetry install --with local
[tool.poetry.group.local]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
local = [
    "sentence-transformers (>=6.1.0,<7.0.0)"
]
